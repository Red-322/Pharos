<text x="807" y="446" text-anchor="middle" font-size="12.5" fill="#1D9E75">决定调用 knowledgeBaseSearch</text>
<path d="M883 457 L737 457" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<text x="885" y="484" text-anchor="middle" font-size="12.5" fill="#185FA5">search(query, ToolContext)</text>
<path d="M732 495 L1033 495" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

<text x="1090" y="512" font-size="11.5" fill="#0F6E56">防重复调用检查 + 从 ToolContext 取 groupId</text>
<path d="M1040 523 L1068 523 L1068 534 L1048 534" stroke="#0F6E56" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>

<text x="1117" y="552" text-anchor="middle" font-size="12.5" fill="#185FA5">retrieveEvidence(groupId, query)</text>
<path d="M1042 563 L1188 563" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

<text x="1272" y="580" text-anchor="middle" font-size="12.5" fill="#185FA5">retrieve(groupId, question, topK=5)</text>
<path d="M1197 591 L1343 591" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

<rect x="903" y="602" width="560" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>
<text x="915" y="620" font-size="12" font-weight="600" fill="#72243E">HybridChunkRetrievalService.retrieve() 内部 7 步</text>
<text x="915" y="641" font-size="11.5" fill="#4B1528">① QueryPlanningService.plan()　查询规划 + 改写（1 次 LLM 调用）</text>
<text x="915" y="661" font-size="11.5" fill="#4B1528">② 顺序召回：向量 Top50 + 关键词 Top50（每个 plannedQuery，非并行）</text>
<text x="915" y="681" font-size="11.5" fill="#4B1528">③ RRF 按 chunkId 累加 → 归一化 1 - e^(-x)</text>
<text x="915" y="701" font-size="11.5" font-weight="600" fill="#D85A30">④ ★ Rerank 插入点 → selectRankedCandidates 取 Top5</text>
<text x="915" y="721" font-size="11.5" fill="#4B1528">⑤ 聚类（同文档 + 连续切片）　⑥ 邻居窗口扩展（前后各 1）</text>
<text x="915" y="741" font-size="11.5" fill="#4B1528">⑦ 证据分级 NONE / WEAK / PARTIAL / SUFFICIENT</text>

<text x="1272" y="778" text-anchor="middle" font-size="12.5" fill="#1D9E75">RetrievedEvidenceBundle</text>
<path d="M1348 789 L1202 789" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<text x="1117" y="812" text-anchor="middle" font-size="12.5" fill="#1D9E75">证据 + citations</text>
<path d="M1193 823 L1047 823" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<text x="1090" y="846" font-size="11.5" fill="#0F6E56">证据为空 → INSUFFICIENT_EVIDENCE 拒答</text>
<path d="M1040 857 L1068 857 L1068 868 L1048 868" stroke="#0F6E56" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>

<text x="885" y="894" text-anchor="middle" font-size="12.5" fill="#1D9E75">evidenceLevel + evidenceGuidance + evidences</text>
<path d="M1038 905 L892 905" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<text x="807" y="928" text-anchor="middle" font-size="12.5" fill="#185FA5">第 2 次调用（工具结果 + 证据）</text>
<path d="M732 939 L878 939" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

<text x="807" y="962" text-anchor="middle" font-size="12.5" fill="#1D9E75">最终回答</text>
<path d="M883 973 L737 973" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<text x="652" y="996" text-anchor="middle" font-size="12.5" fill="#1D9E75">AssistantMessage → 取 resultHolder.currentCitations()</text>
<path d="M730 1007 L582 1007" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>

<rect x="40" y="1024" width="1540" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="54" y="1040" font-size="11.5" fill="#444441">说明 1：图中"检索门面"合并了两层 —— QaRetrievalService（内部调 CitationAssembler 组装引用）→ ReadyChunkDocumentRetriever。为图面清晰未单独展开。</text>
<text x="54" y="1056" font-size="11.5" fill="#444441">说明 2：模型调用的实际通道是 Spring AI 的 ChatClient；工具执行由框架在 ReactAgent 图循环内触发，非代码显式调用。</text>
</svg>
