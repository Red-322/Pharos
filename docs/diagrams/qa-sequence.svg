<text x="40" y="34" font-size="25" font-weight="600" fill="#141414">Pharos 一次问答完整时序图 · QA 模块（同步问答）</text>
<text x="40" y="58" font-size="13" fill="#6b6b6b">入口：POST /api/qa/ask ｜ 从上到下 = 时间 ｜ 蓝实线 = 调用，绿虚线 = 返回，紫 = 内部计算 ｜ ★ = 改造落点</text>
<text x="40" y="78" font-size="12.5" fill="#A32D2D">⚠ 这是 qa 模块的链路。assistant 模块（Agent / KB_SEARCH 模式）是另一条独立入口，见「时序图-Agent链路.png」</text>

